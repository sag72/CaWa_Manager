<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Aplicações</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #5b6676;
    --border: #e2e6ec; --accent: #2b6cb0; --accent-soft: #e8f0fa; --shadow: 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --card: #1b2129; --text: #e6e9ee; --muted: #9aa4b2;
      --border: #2a323d; --accent: #6aa5e6; --accent-soft: #1f2d3e; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --card: #1b2129; --text: #e6e9ee; --muted: #9aa4b2;
    --border: #2a323d; --accent: #6aa5e6; --accent-soft: #1f2d3e; --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 40px 16px 56px; }
  header h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); }
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  nav a {
    font-size: 13px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px;
    color: var(--text); text-decoration: none; background: var(--card);
  }
  nav a:hover { background: var(--accent-soft); }
  .search {
    margin: 24px 0 8px; width: 100%; padding: 10px 14px; font: inherit;
    color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  section { margin-top: 32px; scroll-margin-top: 16px; }
  section > h2 { margin: 0; font-size: 19px; font-weight: 600; }
  section > .sub { margin: 2px 0 14px; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 10px; padding: 20px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .icon {
    flex: none; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
    background: var(--accent-soft); font-size: 20px;
  }
  .card h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .tag { font-size: 12px; color: var(--muted); }
  .card p { margin: 0; color: var(--muted); flex: 1; }
  .when { font-size: 13px; color: var(--text); }
  .when b { font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .btn {
    display: inline-block; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--accent-soft); }
  .files {
    list-style: none; margin: 0; padding: 0; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  }
  .files li + li { border-top: 1px solid var(--border); }
  .files a {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px; color: var(--text); text-decoration: none;
  }
  .files a:hover { background: var(--accent-soft); }
  .ext {
    flex: none; width: 46px; text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .03em;
    padding: 3px 0; border-radius: 4px; background: var(--accent-soft); color: var(--accent);
  }
  .file-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .file-app { flex: none; font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) {
    .files a { flex-wrap: wrap; }
    .file-app { width: 100%; padding-left: 58px; }
  }
  .empty { color: var(--muted); padding: 24px 0; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Portal de Aplicações</h1>
    <p>Escolhe a aplicação de que precisas. Os ficheiros são processados no teu browser.</p>
    <nav aria-label="Secções">
      <a href="#operacionais">Operacionais do CAWA</a>
      <a href="#projectos">Acções em Projectos</a>
      <a href="#opls">OPLs</a>
      <a href="#material">Material de apoio</a>
    </nav>
  </header>

  <input class="search" type="search" id="search" placeholder="Procurar (ex.: abertura, fecho, etiquetas, pesos, CAWA)…" aria-label="Procurar">

  <div id="content"></div>
  <p class="empty" id="empty" hidden>Nada corresponde à pesquisa.</p>

  <footer>Falta alguma aplicação ou um link não funciona? Fala com a equipa Cawa.</footer>
</main>

<script>
  // ------------------------------------------------------------------
  // CONFIGURAÇÃO
  // Aplicações: "grupo" decide a secção. "opl" e "material" são caminhos
  // de ficheiros deste repositório (pastas OPLS/ e MATERIAL_APOIO/);
  // deixa "" se não existir.
  // ------------------------------------------------------------------
  const GRUPOS = [
    { id: "operacionais", titulo: "Operacionais do CAWA", sub: "Tarefas do dia a dia: aberturas, fechos e etiquetas das lojas." },
    { id: "projectos", titulo: "Acções em Projectos", sub: "Ferramentas usadas em projectos específicos." }
  ];

  const APPS = [
    {
      grupo: "operacionais",
      nome: "Aberturas de Lojas",
      tag: "dSeries · MFT",
      icone: "🏪",
      descricao: "Acrescenta lojas novas às applications XML do MFT, por insígnia.",
      quando: "Abriu uma loja nova e é preciso incluí-la nos fluxos.",
      url: "https://sag72.github.io/CaWa_NovaLoja/",
      opl: "OPLS/OPL – Abertura de Lojas no dSeries.pdf",
      material: ""
    },
    {
      grupo: "operacionais",
      nome: "Fechos de Lojas",
      tag: "dSeries · MFT",
      icone: "🔒",
      descricao: "Remove lojas fechadas das applications XML do MFT.",
      quando: "Uma loja fechou e tem de sair dos fluxos.",
      url: "https://sag72.github.io/CaWa_ApagarLoja/",
      opl: "OPLS/OPL – Fecho de Lojas no dSeries.pdf",
      material: ""
    },
    {
      grupo: "operacionais",
      nome: "Etiquetas Eletrónicas",
      tag: "VUSION · GAMFT CQPML",
      icone: "🏷️",
      descricao: "Adiciona ou remove lojas nos XML VUSION (ELEC/STOCK) e GAMFT CQPML.",
      quando: "Uma loja passa a ter (ou deixa de ter) etiquetas eletrónicas.",
      url: "https://sag72.github.io/CaWa_EtiquetasElectronicas/",
      opl: "",
      material: ""
    },
    {
      grupo: "projectos",
      nome: "Gerador CAWA ELECTAG CQ/PML",
      tag: "CAWA · MFT",
      icone: "⚙️",
      descricao: "Gera as applications MFT_FO_GAMFT_ELECTAG_CQPML a partir do Excel de lojas, acrescenta lojas/jobs e adiciona insígnia aos jobs PML.",
      quando: "É preciso criar ou atualizar applications CQ/PML em bloco.",
      url: "https://sag72.github.io/CaWa_Electag_CQ_PML/",
      opl: "OPLS/OPL_Gerador_CAWA.docx",
      material: "MATERIAL_APOIO/LojasUnifo_CQ_PML.xlsx"
    },
    {
      grupo: "projectos",
      nome: "Pesos",
      tag: "CAWA · MFT · SCOT",
      icone: "⚖️",
      descricao: "Acrescenta lojas do Excel às applications XML MFT de pesos (SCOT EANS), por insígnia (CNT, CBD, MDL).",
      quando: "É preciso incluir lojas novas nos fluxos de pesos.",
      url: "https://sag72.github.io/CaWa_Pesos/",
      opl: "",
      material: "MATERIAL_APOIO/CAWA_MFT_BDPESOS.xlsx"
    },
    {
      grupo: "projectos",
      nome: "Gerador de Applications MFT",
      tag: "CAWA · EAI → MFT",
      icone: "🔁",
      descricao: "Gera os XML das applications MFT a partir do Excel de migração EAI → MFT, copiando horários, dependências e jobs ligados do EAI de origem.",
      quando: "É preciso migrar applications EAI para MFT em bloco.",
      url: "https://sag72.github.io/CaWa_GeradorMFT/",
      opl: "",
      material: ""
    },
    {
      grupo: "operacionais",
      nome: "Lojas SALES",
      tag: "MFT · SALES",
      icone: "🛒",
      descricao: "Adiciona ou remove lojas nos jobs SALES / nb_sales_files_fo_ok de uma application, e põe lojas de um CSV em \"Only on request\".",
      quando: "É preciso mexer nas lojas dos jobs de vendas ou suspendê-las (only on request).",
      url: "https://sag72.github.io/CaWa_LojasSales/",
      opl: "",
      material: ""
    }
  ];

  // Ficheiros das pastas (o "app" indica para que aplicação servem).
  const OPLS = [
    { ficheiro: "OPLS/OPL – Abertura de Lojas no dSeries.pdf", app: "Aberturas de Lojas" },
    { ficheiro: "OPLS/OPL – Fecho de Lojas no dSeries.pdf", app: "Fechos de Lojas" },
    { ficheiro: "OPLS/OPL_Gerador_CAWA.docx", app: "Gerador CAWA ELECTAG CQ/PML" }
  ];

  const MATERIAL = [
    { ficheiro: "MATERIAL_APOIO/LojasUnifo_CQ_PML.xlsx", app: "Gerador CAWA ELECTAG CQ/PML" },
    { ficheiro: "MATERIAL_APOIO/CAWA_MFT_BDPESOS.xlsx", app: "Pesos" }
  ];

  const content = document.getElementById("content");
  const empty = document.getElementById("empty");
  const search = document.getElementById("search");

  function el(tag, attrs, text) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
    if (text) node.textContent = text;
    return node;
  }

  const nomeFicheiro = caminho => caminho.split("/").pop();
  const extensao = caminho => (caminho.split(".").pop() || "").toUpperCase();
  const corresponde = (q, ...campos) => campos.join(" ").toLowerCase().includes(q);

  function secao(id, titulo, sub) {
    const s = el("section", { id });
    s.append(el("h2", {}, titulo), el("p", { class: "sub" }, sub));
    return s;
  }

  function cartao(a) {
    const card = el("article", { class: "card" });

    const head = el("div", { class: "card-head" });
    head.append(el("div", { class: "icon", "aria-hidden": "true" }, a.icone));
    const titulo = el("div");
    titulo.append(el("h3", {}, a.nome), el("div", { class: "tag" }, a.tag));
    head.append(titulo);

    const quando = el("div", { class: "when" });
    quando.append(el("b", {}, "Quando usar: "), document.createTextNode(a.quando));

    const actions = el("div", { class: "actions" });
    actions.append(el("a", { class: "btn btn-primary", href: a.url, target: "_blank", rel: "noopener" }, "Abrir aplicação"));
    if (a.opl) actions.append(el("a", { class: "btn btn-secondary", href: encodeURI(a.opl), target: "_blank", rel: "noopener" }, "OPL"));
    if (a.material) actions.append(el("a", { class: "btn btn-secondary", href: encodeURI(a.material), download: "" }, "Material"));

    card.append(head, el("p", {}, a.descricao), quando, actions);
    return card;
  }

  function listaFicheiros(itens) {
    const ul = el("ul", { class: "files" });
    itens.forEach(f => {
      const li = el("li");
      const link = el("a", { href: encodeURI(f.ficheiro), target: "_blank", rel: "noopener" });
      link.append(
        el("span", { class: "ext" }, extensao(f.ficheiro)),
        el("span", { class: "file-name" }, nomeFicheiro(f.ficheiro)),
        el("span", { class: "file-app" }, f.app)
      );
      li.append(link);
      ul.append(li);
    });
    return ul;
  }

  function render(filtro) {
    const q = (filtro || "").trim().toLowerCase();
    content.replaceChildren();
    let total = 0;

    GRUPOS.forEach(g => {
      const apps = APPS.filter(a => a.grupo === g.id && corresponde(q, a.nome, a.tag, a.descricao, a.quando, g.titulo));
      if (!apps.length) return;
      total += apps.length;
      const s = secao(g.id, g.titulo, g.sub);
      const grid = el("div", { class: "grid" });
      apps.forEach(a => grid.append(cartao(a)));
      s.append(grid);
      content.append(s);
    });

    [
      { id: "opls", titulo: "📁 OPLs", sub: "Manuais passo a passo de cada aplicação.", itens: OPLS },
      { id: "material", titulo: "📁 Material de apoio", sub: "Ficheiros necessários para usar algumas aplicações.", itens: MATERIAL }
    ].forEach(p => {
      const itens = p.itens.filter(f => corresponde(q, nomeFicheiro(f.ficheiro), f.app, p.titulo));
      if (!itens.length) return;
      total += itens.length;
      const s = secao(p.id, p.titulo, p.sub);
      s.append(listaFicheiros(itens));
      content.append(s);
    });

    empty.hidden = total > 0;
  }

  search.addEventListener("input", e => render(e.target.value));
  render("");
</script>
</body>
</html>
