<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal de Aplicações</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #5b6676;
    --border: #e2e6ec; --accent: #2b6cb0; --accent-soft: #e8f0fa; --shadow: 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --card: #1b2129; --text: #e6e9ee; --muted: #9aa4b2;
      --border: #2a323d; --accent: #6aa5e6; --accent-soft: #1f2d3e; --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12161c; --card: #1b2129; --text: #e6e9ee; --muted: #9aa4b2;
    --border: #2a323d; --accent: #6aa5e6; --accent-soft: #1f2d3e; --shadow: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 40px 16px 56px; }
  header h1 { margin: 0 0 6px; font-size: 26px; font-weight: 600; }
  header p { margin: 0; color: var(--muted); }
  .search {
    margin: 24px 0 20px; width: 100%; padding: 10px 14px; font: inherit;
    color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  .search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 10px; padding: 20px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .icon {
    flex: none; width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center;
    background: var(--accent-soft); font-size: 20px;
  }
  .card h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .tag { font-size: 12px; color: var(--muted); }
  .card p { margin: 0; color: var(--muted); flex: 1; }
  .when { font-size: 13px; color: var(--text); }
  .when b { font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .btn {
    display: inline-block; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 14px;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-secondary { border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--accent-soft); }
  .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .empty { color: var(--muted); padding: 24px 0; }
  footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Portal de Aplicações</h1>
    <p>Escolhe a aplicação de que precisas. Os ficheiros são processados no teu browser.</p>
  </header>

  <input class="search" type="search" id="search" placeholder="Procurar (ex.: abertura, fecho, etiquetas, CAWA)…" aria-label="Procurar aplicação">

  <section class="grid" id="grid"></section>
  <p class="empty" id="empty" hidden>Nenhuma aplicação corresponde à pesquisa.</p>

  <footer>Falta alguma aplicação ou um link não funciona? Fala com a equipa Cawa.</footer>
</main>

<script>
  // ------------------------------------------------------------------
  // CONFIGURAÇÃO — substitui os URLs pelos links do GitHub Pages.
  // "doc" é opcional (OPL / manual); deixa "" se não existir.
  // ------------------------------------------------------------------
  const APPS = [
    {
      nome: "Aberturas de Lojas",
      tag: "dSeries · MFT",
      icone: "🏪",
      descricao: "Acrescenta lojas novas às applications XML do MFT, por insígnia.",
      quando: "Abriu uma loja nova e é preciso incluí-la nos fluxos.",
      url: "https://sag72.github.io/CaWa_NovaLoja/",
      doc: ""
    },
    {
      nome: "Fechos de Lojas",
      tag: "dSeries · MFT",
      icone: "🔒",
      descricao: "Remove lojas fechadas das applications XML do MFT.",
      quando: "Uma loja fechou e tem de sair dos fluxos.",
      url: "https://sag72.github.io/CaWa_ApagarLoja/",
      doc: ""
    },
    {
      nome: "Etiquetas Eletrónicas",
      tag: "VUSION · GAMFT CQPML",
      icone: "🏷️",
      descricao: "Adiciona ou remove lojas nos XML VUSION (ELEC/STOCK) e GAMFT CQPML.",
      quando: "Uma loja passa a ter (ou deixa de ter) etiquetas eletrónicas.",
      url: "https://sag72.github.io/CaWa_EtiquetasElectronicas/",
      doc: ""
    },
    {
      nome: "Gerador CAWA ELECTAG CQ/PML",
      tag: "CAWA · MFT",
      icone: "⚙️",
      descricao: "Gera as applications MFT_FO_GAMFT_ELECTAG_CQPML a partir do Excel de lojas, acrescenta lojas/jobs e adiciona insígnia aos jobs PML.",
      quando: "É preciso criar ou atualizar applications CQ/PML em bloco.",
      url: "https://sag72.github.io/CaWa_Electag_CQ_PML/",
      doc: ""
    }
  ];

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const search = document.getElementById("search");

  function el(tag, attrs, text) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
    if (text) node.textContent = text;
    return node;
  }

  function render(filtro) {
    const q = (filtro || "").trim().toLowerCase();
    grid.replaceChildren();
    const visiveis = APPS.filter(a =>
      [a.nome, a.tag, a.descricao, a.quando].join(" ").toLowerCase().includes(q));

    visiveis.forEach(a => {
      const card = el("article", { class: "card" });

      const head = el("div", { class: "card-head" });
      head.append(el("div", { class: "icon", "aria-hidden": "true" }, a.icone));
      const titulo = el("div");
      titulo.append(el("h2", {}, a.nome), el("div", { class: "tag" }, a.tag));
      head.append(titulo);

      const quando = el("div", { class: "when" });
      quando.append(el("b", {}, "Quando usar: "), document.createTextNode(a.quando));

      const actions = el("div", { class: "actions" });
      const abrir = el("a", { class: "btn btn-primary", href: a.url || "#", target: "_blank", rel: "noopener" }, "Abrir aplicação");
      if (!a.url) abrir.setAttribute("aria-disabled", "true");
      actions.append(abrir);
      if (a.doc) {
        actions.append(el("a", { class: "btn btn-secondary", href: a.doc, target: "_blank", rel: "noopener" }, "Manual (OPL)"));
      }

      card.append(head, el("p", {}, a.descricao), quando, actions);
      grid.append(card);
    });

    empty.hidden = visiveis.length > 0;
  }

  search.addEventListener("input", e => render(e.target.value));
  render("");
</script>
</body>
</html>
